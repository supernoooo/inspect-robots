[build-system]
requires = ["hatchling>=1.18", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "inspect-robots-libero"
version = "0.1.0"
description = "LIBERO embodiment, benchmark tasks, and MolmoAct2-LIBERO policy adapter for Inspect Robots."
dynamic = ["readme"]
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Inspect Robots contributors" }]
keywords = ["robotics", "libero", "franka", "molmoact2", "inspect_robots", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# LIBERO is intentionally not a dependency because its official installation is
# a source checkout with MuJoCo assets. The plugin imports it only on reset or
# task construction. HTTP transport dependencies are ordinary PyPI packages.
dependencies = [
    "inspect-robots>=0.2",
    "numpy>=1.24",
    "requests>=2.31",
    "json-numpy>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.11", "ruff>=0.6"]

[project.entry-points."inspect_robots.embodiments"]
libero = "inspect_robots_libero:libero_embodiment"

[project.entry-points."inspect_robots.policies"]
libero-noop = "inspect_robots_libero:libero_noop_policy"
molmoact2-libero = "inspect_robots_libero:molmoact2_libero_policy"

[project.entry-points."inspect_robots.tasks"]
libero-spatial = "inspect_robots_libero:libero_spatial"
libero-object = "inspect_robots_libero:libero_object"
libero-goal = "inspect_robots_libero:libero_goal"
libero-10 = "inspect_robots_libero:libero_10"
libero-90 = "inspect_robots_libero:libero_90"

[project.urls]
Homepage = "https://github.com/robocurve/inspect-robots/tree/main/plugins/inspect-robots-libero"
Repository = "https://github.com/robocurve/inspect-robots"

[tool.uv.sources]
inspect-robots = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/inspect_robots_libero"]

[tool.hatch.build.targets.sdist]
include = ["src/inspect_robots_libero", "tests", "README.md"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["inspect_robots", "inspect_robots_libero"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["json_numpy.*", "libero.*", "requests.*", "torch.*"]
ignore_missing_imports = true

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?m)^> \[!NOTE\][ \t]*$'
replacement = '> **Note:**'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?m)^> \[!TIP\][ \t]*$'
replacement = '> **Tip:**'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?m)^> \[!IMPORTANT\][ \t]*$'
replacement = '> **Important:**'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?m)^> \[!WARNING\][ \t]*$'
replacement = '> **Warning:**'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?m)^> \[!CAUTION\][ \t]*$'
replacement = '> **Caution:**'
